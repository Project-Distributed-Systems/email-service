spring.application.name=notification-test
# Perfil exclusivo para testes de integração.
# As URLs de datasource e RabbitMQ são sobrescritas dinamicamente
# pelo @DynamicPropertySource da classe base — esses valores são placeholders
# que garantem que o Spring não tente conectar em nenhum host real antes
# dos containers estarem prontos.

# spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
# spring.datasource.username=test
# spring.datasource.password=test
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# spring.rabbitmq.host=localhost
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=guest
# spring.rabbitmq.password=guest

# Desabilita banner e reduz ruído nos logs dos testes
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.ticket=INFO
